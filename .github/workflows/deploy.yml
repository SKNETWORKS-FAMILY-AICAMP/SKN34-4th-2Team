name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_CONFIGURED: ${{ secrets.AWS_ROLE_ARN != '' }}
    defaults:
      run:
        working-directory: lms_react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build web
        env:
          # GitHub → Settings → Variables → VITE_API_BASE (없으면 /api)
          VITE_API_BASE: ${{ vars.VITE_API_BASE != '' && vars.VITE_API_BASE || '/api' }}
        run: npm run build
      - name: Upload web dist
        if: ${{ env.AWS_ROLE_CONFIGURED == 'true' }}
        run: echo "Configure AWS_ROLE_ARN, WEB_S3_BUCKET, CLOUDFRONT_ID to enable s3 sync"

  api:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_CONFIGURED: ${{ secrets.AWS_ROLE_ARN != '' }}
      EC2_HOST_CONFIGURED: ${{ secrets.EC2_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f lms_api/Dockerfile -t lms-api .
      # 챗봇 · 공부방 노트 · 첨삭 · 공고 추천. 이게 없으면 배포해도 그 기능들이 갈 곳이 없다.
      - name: Build AI image
        run: docker build -f deploy/ai.Dockerfile -t lms-ai .
      - name: Push ECR
        if: ${{ env.AWS_ROLE_CONFIGURED == 'true' }}
        run: echo "Configure AWS_ROLE_ARN and ECR_REPOSITORY to enable push (lms-api, lms-ai 둘 다)"
      - name: Deploy EC2
        if: ${{ env.EC2_HOST_CONFIGURED == 'true' }}
        run: echo "Configure EC2_HOST to docker compose -f docker-compose.prod.yml pull && up -d"
