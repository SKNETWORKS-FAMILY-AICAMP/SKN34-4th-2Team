name: close-issues

# 기본 브랜치가 main 이라 develop 에 합친 PR 의 `Closes #n` 은 GitHub 이 닫아 주지 않는다.
# develop 에 병합되면 PR 본문의 Closes · Fixes · Resolves #n 을 읽어 그 이슈를 닫는다.
# pull_request_target 이라 develop 에 있는 이 파일로 돌고, 코드는 받지 않는다.

on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(pattern)].map((m) => Number(m[1])))];
            const pr = context.payload.pull_request.number;
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === "closed") continue;
              await github.rest.issues.createComment({
                ...context.repo, issue_number, body: `#${pr} 가 develop 에 병합되어 닫습니다.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number, state: "closed", state_reason: "completed",
              });
              core.info(`#${issue_number} 닫음`);
            }
