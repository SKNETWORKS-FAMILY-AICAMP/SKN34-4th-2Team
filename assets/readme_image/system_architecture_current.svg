<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PLAYDATA LXP 전체 시스템 아키텍처</title>
  <desc id="desc">React 웹과 Expo 앱이 Nginx를 통해 Django Ninja API에 접근한다. Django는 PostgreSQL과 S3를 사용하고 내부 FastAPI AI 서버를 호출한다. AI 서버는 Pinecone과 OpenAI API를 사용한다. Redis와 Celery는 백그라운드 작업을 처리한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #17212f; letter-spacing: 0; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #596575; }
      .region { font-size: 20px; font-weight: 700; }
      .name { font-size: 22px; font-weight: 700; }
      .detail { font-size: 16px; fill: #455468; }
      .note { font-size: 15px; fill: #596575; }
      .edge { fill: none; stroke: #374151; stroke-width: 2.5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fbfcfe"/>
  <text class="title" x="58" y="70">PLAYDATA LXP · 전체 시스템 아키텍처</text>
  <text class="subtitle" x="58" y="104">현재 코드와 배포 설정 기준 · 운영 자동 배포는 미완료</text>

