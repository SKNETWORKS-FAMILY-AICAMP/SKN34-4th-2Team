# Run from the repository root with --env-file .env -f deploy/docker-compose.django.yml.
# Paths below are relative to this compose file (deploy/), not the shell's cwd.
services:
  redis:
    image: redis:7
    restart: unless-stopped

  api:
    image: ${ECR_IMAGE:?Set ECR_IMAGE in the deployment environment}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DJANGO_DEBUG: "0"
      LMS_INLINE_PUBLISH: "0"
      REDIS_URL: redis://redis:6379/0
      CHATBOT_URL: ${CHATBOT_URL:?Set the FastAPI private URL}
      JOBS_URL: ${JOBS_URL:?Set the FastAPI private URL}
      STUDY_NOTES_URL: ${STUDY_NOTES_URL:?Set the FastAPI private URL}
      RESUME_REVIEW_URL: ${RESUME_REVIEW_URL:?Set the FastAPI private URL}
      LMS_AI_SHARED_TOKEN: ${LMS_AI_SHARED_TOKEN:?Set the shared service token}
    depends_on:
      - redis
    command: >
      gunicorn lms_server.wsgi:application --bind 0.0.0.0:8000
      --workers 3 --threads 4 --timeout 240

  worker:
    image: ${ECR_IMAGE:?Set ECR_IMAGE in the deployment environment}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      LMS_INLINE_PUBLISH: "0"
    depends_on:
      - redis
    command: celery -A lms_server worker -l info

  beat:
    image: ${ECR_IMAGE:?Set ECR_IMAGE in the deployment environment}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      LMS_INLINE_PUBLISH: "0"
    depends_on:
      - redis
    command: celery -A lms_server beat -l info

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
