# Overlay on docker-compose.django.yml for the private CloudFront origin.
services:
  api:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      DJANGO_SETTINGS_MODULE: production_settings
      AUTH_SESSION_BACKEND: redis
      AUTH_TRUST_CLOUDFRONT_CLIENT_IP: "1"
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:?Set the private nginx Docker subnet}
    volumes:
      - ./production_settings.py:/app/production_settings.py:ro
  worker:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      DJANGO_SETTINGS_MODULE: production_settings
    volumes:
      - ./production_settings.py:/app/production_settings.py:ro
    command: celery -A lms_server worker -l info --concurrency=1
  beat:
    command: celery -A lms_server beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: production_settings
    volumes:
      - ./production_settings.py:/app/production_settings.py:ro
  nginx:
    volumes:
      - ./nginx/cloudfront.conf:/etc/nginx/conf.d/default.conf:ro
