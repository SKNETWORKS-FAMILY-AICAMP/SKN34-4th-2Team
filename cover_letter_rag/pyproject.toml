[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cover-letter-rag"
version = "0.2.0"
description = "Job-posting grounded resume review API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<2",
  "uvicorn[standard]>=0.34,<1",
  "langchain>=1.1,<2",
  "langchain-core>=1.1,<2",
  "langchain-openai>=1.4.1,<2",
  "firebase-admin>=7,<8",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
